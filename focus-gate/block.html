<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Focus Gate</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #2a2840, #14131e);
    color: #f3f1fa;
  }
  .card {
    text-align: center;
    max-width: 640px;
    padding: 32px;
  }
  .icon { font-size: 44px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0 0 10px 0; }
  p { font-size: 14px; opacity: 0.8; line-height: 1.5; margin: 0 0 24px 0; }
  #site { font-weight: 600; color: #b39dff; }
  .suggestion {
    font-size: 16px;
    font-weight: 600;
    color: #b39dff;
    background: #2a2840;
    padding: 14px 18px;
    border-radius: 12px;
    margin: 0;
  }
  .streak-note {
    font-size: 12px;
    opacity: 0.6;
    margin: 16px 0 0 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚫</div>
    <h1>Time to focus on something better.</h1>
    <p><span id="site"></span> is blocked right now, and that's a good thing. You set this boundary for yourself because you know what actually moves you forward. Use this moment for something positive instead. Toggle off in the extension anytime you truly need through.</p>
    <p id="suggestion" class="suggestion"></p>
    <p id="streakNote" class="streak-note"></p>
  </div>
  <script src="block.js"></script>
</body>
</html>
